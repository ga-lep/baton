name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BATON_NO_UPDATE_CHECK: "1"

jobs:
  gate:
    name: gate
    uses: ./.github/workflows/ci.yml

  verify:
    name: verify
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install
      - name: Check tag against workspace version
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="baton"))')
          echo "Workspace version: $version"
          if [[ "$EVENT" == push && "$REF" == refs/tags/v* ]]; then
            if [[ "${REF_NAME#v}" != "$version" ]]; then
              echo "::error::tag $REF_NAME does not match workspace version $version"
              exit 1
            fi
          else
            echo "Build-only mode: skipping tag comparison."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, x86_64-unknown-linux-gnu]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install
      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Add target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p baton --target "$TARGET"
      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/baton"
          out=$("$bin" --version)
          echo "$out"
          [[ "$out" == "baton $VERSION" ]] || { echo "::error::unexpected --version output"; exit 1; }
          BATON_NO_UPDATE_CHECK=1 "$bin" version
          if [[ "$TARGET" == *-musl ]]; then
            desc=$(file "$bin")
            echo "$desc"
            # `file` words this as "statically linked" or "static-pie linked" depending on version/PIE.
            grep -Eq 'statically linked|static-pie linked' <<<"$desc" || { echo "::error::file does not report a static binary"; exit 1; }
            # Structural check independent of `file`'s wording: no dynamic loader, no shared-library deps.
            if readelf -lW "$bin" | grep -q 'INTERP'; then
              echo "::error::binary has an INTERP program header (dynamically linked)"; exit 1
            fi
            if readelf -dW "$bin" 2>/dev/null | grep -q '(NEEDED)'; then
              echo "::error::binary has NEEDED shared-library entries"; exit 1
            fi
          fi
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/v* ]]; then id="$REF_NAME"; else id="${SHA::12}"; fi
          name="baton-$id-$TARGET"
          mkdir -p "out/$name"
          cp "target/$TARGET/release/baton" LICENSE README.md "out/$name/"
          mkdir -p dist
          tar -C out -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baton-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: baton-*
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          archives=$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l)
          sums=$(find . -maxdepth 1 -type f -name '*.tar.gz.sha256' | wc -l)
          total=$(find . -type f | wc -l)
          if [[ "$archives" != 2 || "$sums" != 2 || "$total" != 4 ]]; then
            echo "::error::unexpected dist contents"
            ls -lR .
            exit 1
          fi
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          [[ $(find . -type f | wc -l) == 5 ]] || { echo "::error::dist must hold exactly 5 files"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
