[workspace]
resolver = "3"
members = ["crates/baton-proto", "crates/baton-core", "crates/baton", "crates/baton-testkit"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
nix = { version = "0.30", features = ["poll", "term"] }
portable-pty = "0.9"
regex = "1"
semver = "1"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"
baton-proto = { path = "crates/baton-proto" }
baton-core = { path = "crates/baton-core" }
baton-testkit = { path = "crates/baton-testkit" }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
