[package]
name = "baton-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal UI for running and supervising several Claude Code sessions"
repository = "https://github.com/ga-lep/baton"
publish = ["crates-io"]

[lints]
workspace = true

[dependencies]
clap.workspace = true
baton-core = { version = "0.2.11", path = "../baton-core" }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
tui-term = "0.3"
vt100 = "0.16"
anyhow.workspace = true
portable-pty.workspace = true
serde_json.workspace = true
baton-proto = { version = "0.2.11", path = "../baton-proto" }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
nix = { workspace = true, features = ["fs", "signal", "process", "user"] }
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "time", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
thiserror.workspace = true
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
notify-rust = "4"
uuid.workspace = true
shell-words = "1.1.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tempfile.workspace = true

[dev-dependencies]
baton-testkit.workspace = true
tempfile.workspace = true
regex.workspace = true

[[bin]]
name = "baton"
path = "src/main.rs"
